name: go-starter-kit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Bound to localhost only: these credentials must not be reachable
      # from the network the machine is on.
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the Unix socket: the temporary server that runs the init
      # scripts only listens on the socket, so this waits until they are done.
      test: ["CMD-SHELL", "pg_isready -h localhost -U app -d app"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  # The API in a container, built from the Dockerfile: make docker-full.
  # The default `make docker-up` starts PostgreSQL only.
  api:
    build: .
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      DB_AUTO_MIGRATE: "true"
      # From .env or the shell. Empty, the API refuses to start and says why.
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:${API_FORWARD_PORT:-8080}:8080"

volumes:
  postgres-data:
